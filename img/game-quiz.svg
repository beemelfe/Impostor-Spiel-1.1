<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 180" role="img" aria-label="Antwortkarten A bis D und eine Stoppuhr mit Blitz">
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ecfeff"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#134e4a" flood-opacity="0.34"/>
    </filter>
  </defs>

  <!-- Antwortkarten -->
  <g filter="url(#shadow)" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="12" text-anchor="middle">
    <g transform="rotate(-6 70 50)">
      <rect x="20" y="34" width="100" height="28" rx="14" fill="#ffffff"/>
      <circle cx="35" cy="48" r="9" fill="#ccfbf1"/><text x="35" y="52.5" fill="#0f766e">A</text>
      <rect x="50" y="44" width="54" height="8" rx="4" fill="#ccfbf1"/>
    </g>
    <g transform="rotate(-6 70 84)">
      <rect x="20" y="68" width="100" height="28" rx="14" fill="#22c55e"/>
      <circle cx="35" cy="82" r="9" fill="#ffffff"/><text x="35" y="86.5" fill="#16a34a">B</text>
      <rect x="50" y="78" width="40" height="8" rx="4" fill="#bbf7d0"/>
      <path d="M98 82 l5 5 9 -10" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="rotate(-6 70 118)">
      <rect x="20" y="102" width="100" height="28" rx="14" fill="#ffffff"/>
      <circle cx="35" cy="116" r="9" fill="#ccfbf1"/><text x="35" y="120.5" fill="#0f766e">C</text>
      <rect x="50" y="112" width="48" height="8" rx="4" fill="#ccfbf1"/>
    </g>
    <g transform="rotate(-6 70 152)">
      <rect x="20" y="136" width="100" height="28" rx="14" fill="#ffffff"/>
      <circle cx="35" cy="150" r="9" fill="#ccfbf1"/><text x="35" y="154.5" fill="#0f766e">D</text>
      <rect x="50" y="146" width="36" height="8" rx="4" fill="#ccfbf1"/>
    </g>
  </g>

  <!-- Stoppuhr -->
  <g filter="url(#shadow)" transform="rotate(10 162 100)">
    <rect x="154" y="34" width="16" height="13" rx="3.5" fill="#ffffff"/>
    <rect x="186" y="50" width="11" height="9" rx="3" fill="#ffffff" transform="rotate(40 191 54)"/>
    <circle cx="162" cy="100" r="46" fill="#ffffff"/>
    <circle cx="162" cy="100" r="37" fill="url(#face)"/>
    <path d="M162 100 L162 63 A37 37 0 0 1 196 86 Z" fill="#2dd4bf" opacity="0.9"/>
    <line x1="162" y1="100" x2="186" y2="80" stroke="#0f766e" stroke-width="5" stroke-linecap="round"/>
    <circle cx="162" cy="100" r="5.5" fill="#0f766e"/>
  </g>

  <!-- Blitz -->
  <path d="M198 8 l-16 28 h12 l-8 24 22 -32 h-12 l9 -20z" fill="#fde047" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Konfetti -->
  <rect x="128" y="160" width="9" height="5" rx="2" fill="#fde047" transform="rotate(25 132 162)"/>
  <rect x="204" y="150" width="9" height="5" rx="2" fill="#ffffff" transform="rotate(-30 208 152)"/>
  <circle cx="132" cy="22" r="4" fill="#ffffff" opacity="0.75"/>
</svg>

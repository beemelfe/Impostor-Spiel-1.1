<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 180" role="img" aria-label="Spielkarten und ein Imposter mit Hut und Brille">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffe4e6"/>
    </linearGradient>
    <linearGradient id="spy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2340"/>
      <stop offset="1" stop-color="#15111f"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#7f1d1d" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- hintere Karte -->
  <g filter="url(#shadow)" transform="rotate(-17 70 118)">
    <rect x="28" y="44" width="82" height="114" rx="13" fill="url(#card)"/>
    <rect x="42" y="68" width="54" height="8" rx="4" fill="#fda4af"/>
    <rect x="42" y="84" width="40" height="8" rx="4" fill="#fecdd3"/>
    <rect x="42" y="100" width="48" height="8" rx="4" fill="#fecdd3"/>
  </g>

  <!-- mittlere Karte mit geheimem Wort -->
  <g filter="url(#shadow)" transform="rotate(-3 110 104)">
    <rect x="68" y="30" width="84" height="116" rx="13" fill="url(#card)"/>
    <circle cx="110" cy="62" r="13" fill="#ffe4e6"/>
    <path d="M104 62 l4 4 8 -9" fill="none" stroke="#e11d48" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="99" y="99" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="15" fill="#e11d48" text-anchor="middle">WORT</text>
    <rect x="84" y="112" width="52" height="7" rx="3.5" fill="#fecdd3"/>
    <rect x="92" y="125" width="36" height="7" rx="3.5" fill="#fecdd3"/>
  </g>

  <!-- Imposter-Karte -->
  <g filter="url(#shadow)" transform="rotate(14 160 106)">
    <rect x="118" y="40" width="84" height="116" rx="13" fill="url(#spy)"/>
    <!-- Hut -->
    <ellipse cx="160" cy="80" rx="31" ry="6.5" fill="#0b0a12"/>
    <path d="M141 80 Q143 56 160 56 Q177 56 179 80 Z" fill="#0b0a12"/>
    <rect x="141.5" y="71" width="37" height="6" fill="#fb7185"/>
    <!-- Gesicht mit Kragen -->
    <path d="M143 86 Q160 116 177 86 Z" fill="#fde2e4"/>
    <path d="M138 104 L150 96 L160 110 L170 96 L182 104 L182 112 L138 112 Z" fill="#0b0a12"/>
    <!-- Sonnenbrille -->
    <circle cx="152.5" cy="90" r="6" fill="#0b0a12"/>
    <circle cx="167.5" cy="90" r="6" fill="#0b0a12"/>
    <rect x="157" y="88.5" width="6" height="2.4" fill="#0b0a12"/>
    <!-- Fragezeichen -->
    <text x="160" y="146" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="26" fill="#fb7185" text-anchor="middle">?</text>
  </g>

  <!-- Funkeln -->
  <path d="M26 24 l3.5 9 9 3.5 -9 3.5 -3.5 9 -3.5 -9 -9 -3.5 9 -3.5z" fill="#ffffff" opacity="0.95"/>
  <path d="M204 150 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5z" fill="#ffffff" opacity="0.8"/>
  <circle cx="198" cy="26" r="5" fill="#ffffff" opacity="0.7"/>
  <circle cx="16" cy="152" r="4" fill="#ffffff" opacity="0.6"/>
</svg>
